plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'io.github.stefanmhsg.ccrs'
version = providers.gradleProperty('ccrsVersion').getOrElse('0.1.0-SNAPSHOT')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
    options.addBooleanOption('Werror', true)
}

def ccrsVersion = providers.gradleProperty('ccrsVersion')
    .getOrElse('0.1.0-SNAPSHOT')

dependencies {
    api "io.github.stefanmhsg.ccrs:ccrs-core:${ccrsVersion}"

    implementation 'io.github.cdimascio:dotenv-java:3.0.0'
    implementation 'io.github.a2asdk:a2a-java-sdk-reference-rest:0.3.3.Final'
    implementation 'io.github.a2asdk:a2a-java-sdk-client:0.3.3.Final'
    implementation 'io.github.a2asdk:a2a-java-sdk-client-transport-rest:0.3.3.Final'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

test {
    useJUnitPlatform()
}

def githubPackagesUser = providers.gradleProperty('gpr.user')
    .orElse(providers.environmentVariable('GITHUB_ACTOR'))
def githubPackagesToken = providers.gradleProperty('gpr.key')
    .orElse(providers.environmentVariable('GITHUB_TOKEN'))
def stagingRepositoryUrl = providers.gradleProperty('ccrsRepositoryUrl')

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = project.name
                description = "CCRS library module ${project.name}"
            }
        }
    }

    repositories {
        maven {
            name = 'ccrsStaging'
            url = stagingRepositoryUrl.present
                ? uri(stagingRepositoryUrl.get())
                : layout.buildDirectory.dir('local-maven-repo')
        }
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/stefanmhsg/ccrs-bdi')
            credentials {
                username = githubPackagesUser.orNull
                password = githubPackagesToken.orNull
            }
        }
    }
}

tasks.register('verifySnapshotVersion') {
    group = 'publishing'
    description = 'Fails unless the CCRS version is a snapshot.'

    doLast {
        if (!project.version.toString().endsWith('-SNAPSHOT')) {
            throw new GradleException(
                "Refusing snapshot publication for non-snapshot version ${project.version}"
            )
        }
    }
}

tasks.named('publishMavenJavaPublicationToGitHubPackagesRepository') {
    dependsOn tasks.named('verifySnapshotVersion')
}
