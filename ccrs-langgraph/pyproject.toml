[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccrs-langgraph"
description = "LangGraph adapter for the Java Course Check and Revision Strategies libraries"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Not-Specified"
dynamic = ["version"]
authors = [
  { name = "Stefan M. H. S. G." },
]
dependencies = [
  "JPype1>=1.7.1",
  "langchain-core>=0.3.75,<1.0.0",
  "langchain-openai>=0.3.16,<1.0.0",
  "langgraph>=0.6.3,<1.0.0",
  "pydantic>=2.11,<3.0",
  "rdflib>=7.5,<8.0",
]

[project.urls]
Repository = "https://github.com/stefanmhsg/ccrs"
Issues = "https://github.com/stefanmhsg/ccrs/issues"
Releases = "https://github.com/stefanmhsg/ccrs/releases"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["ccrs_langgraph*"]

[tool.setuptools.package-data]
ccrs_langgraph = [
  "_runtime_resolver/*.gradle",
  "_runtime_resolver/gradle/wrapper/*.jar",
  "_runtime_resolver/gradle/wrapper/*.properties",
]

[tool.setuptools.dynamic]
version = { attr = "ccrs_langgraph._version.__version__" }
