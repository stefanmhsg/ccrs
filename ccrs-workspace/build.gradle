plugins {
    id 'base'
}

def ccrsBuilds = [
    'ccrs-core',
    'ccrs-jacamo',
    'ccrs-hypermedea',
    'ccrs-langchain4j',
    'ccrs-a2a'
]

tasks.register('testAll') {
    group = 'verification'
    description = 'Runs the test task in every standalone CCRS build.'
    dependsOn ccrsBuilds.collect { buildName ->
        gradle.includedBuild(buildName).task(':test')
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Runs the build task in every standalone CCRS build.'
    dependsOn ccrsBuilds.collect { buildName ->
        gradle.includedBuild(buildName).task(':build')
    }
}

tasks.register('verifyAll') {
    group = 'verification'
    description = 'Verifies all standalone CCRS builds through local coordinate substitution.'
    dependsOn tasks.named('buildAll')
}

defaultTasks 'verifyAll'
