rootProject.name = 'ccrs-workspace'

def ccrsGroup = 'io.github.stefanmhsg.ccrs'
def ccrsBuilds = [
    'ccrs-core',
    'ccrs-jacamo',
    'ccrs-hypermedea',
    'ccrs-langchain4j',
    'ccrs-a2a'
]

ccrsBuilds.each { buildName ->
    includeBuild("../${buildName}") {
        name = buildName
        dependencySubstitution {
            substitute module("${ccrsGroup}:${buildName}") using project(':')
        }
    }
}
