name: Publish CCRS snapshots

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-ccrs-snapshots
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test, and generate documentation
        run: >-
          ./gradlew classes
          :ccrs-core:test
          :ccrs-jacamo:test
          :ccrs-hypermedea:test
          :ccrs-langchain4j:test
          :ccrs-a2a:test
          :ccrs-core:javadoc
          :ccrs-jacamo:javadoc
          :ccrs-hypermedea:javadoc
          :ccrs-langchain4j:javadoc
          :ccrs-a2a:javadoc

      - name: Publish snapshot modules
        run: ./gradlew publishCcrsSnapshotsToGitHubPackages

  remote-consumer:
    name: Verify clean remote consumer
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve and run remote publications
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/ccrs-consumer-gradle-home
        run: >-
          ./gradlew
          -p examples/ccrs-library-consumer
          -PccrsRepository=github
          --refresh-dependencies
          clean build run
