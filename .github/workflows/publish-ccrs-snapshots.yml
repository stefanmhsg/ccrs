name: Publish CCRS snapshots

# Publication is intentionally manual until tag-driven releases are hardened.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-ccrs-snapshots
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make Gradle wrappers executable
        run: chmod +x ccrs-*/gradlew examples/ccrs-library-consumer/gradlew

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify composite source workspace
        run: ./ccrs-workspace/gradlew -p ccrs-workspace --no-daemon verifyAll

      - name: Build and stage standalone modules
        shell: bash
        run: |
          set -euo pipefail
          staging_repository="$RUNNER_TEMP/ccrs-staging-repo"

          ./ccrs-core/gradlew -p ccrs-core \
            -PccrsRepositoryUrl="$staging_repository" \
            clean build publishMavenJavaPublicationToCcrsStagingRepository

          for module in ccrs-jacamo ccrs-langchain4j ccrs-a2a; do
            "./$module/gradlew" -p "$module" \
              -PccrsRepositoryUrl="$staging_repository" \
              --refresh-dependencies \
              clean build publishMavenJavaPublicationToCcrsStagingRepository
          done

          ./ccrs-hypermedea/gradlew -p ccrs-hypermedea \
            -PccrsRepositoryUrl="$staging_repository" \
            --refresh-dependencies \
            clean build publishMavenJavaPublicationToCcrsStagingRepository

          ./examples/ccrs-library-consumer/gradlew \
            -p examples/ccrs-library-consumer \
            -PccrsRepositoryUrl="$staging_repository" \
            --refresh-dependencies \
            clean build run

      - name: Publish standalone snapshot modules
        shell: bash
        run: |
          set -euo pipefail

          ./ccrs-core/gradlew -p ccrs-core \
            publishMavenJavaPublicationToGitHubPackagesRepository

          for module in ccrs-jacamo ccrs-langchain4j ccrs-a2a; do
            "./$module/gradlew" -p "$module" \
              --refresh-dependencies \
              publishMavenJavaPublicationToGitHubPackagesRepository
          done

          ./ccrs-hypermedea/gradlew -p ccrs-hypermedea \
            --refresh-dependencies \
            publishMavenJavaPublicationToGitHubPackagesRepository

  remote-consumer:
    name: Verify clean remote consumer
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x examples/ccrs-library-consumer/gradlew

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve and run remote publications
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/ccrs-consumer-gradle-home
        run: >-
          ./examples/ccrs-library-consumer/gradlew
          -p examples/ccrs-library-consumer
          --refresh-dependencies
          clean build run
