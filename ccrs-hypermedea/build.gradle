plugins {
    id 'java-library'
    id 'maven-publish'
}

dependencies {
    api project(':ccrs-core')
    api project(':ccrs-jacamo')
    api 'org.hypermedea:hypermedea:0.4.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

test {
    useJUnitPlatform()
}
